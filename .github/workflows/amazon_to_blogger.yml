name: Add Product Review

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Product links (space ya comma se alag karein)"
        required: true
        type: string
  repository_dispatch:
    types: [add-product]   # client_payload: {"urls": "https://... https://..."}

permissions:
  contents: read

# Ek time par ek hi run, warna git push conflict hoga
concurrency:
  group: product-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # 1) Is repo (amazon_to_blogger) ka code -> bot/ folder me
      - name: Checkout script repo
        uses: actions/checkout@v4
        with:
          path: bot

      # 2) Asli website repo (bgtech) -> site/ folder me (GH_PAT se, taaki push ho sake)
      - name: Checkout site repo (bgtech)
        uses: actions/checkout@v4
        with:
          repository: bgtechlab/bgtech
          token: ${{ secrets.BGTECH_PAT }}
          path: site
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bot/requirements.txt

      - name: Install dependencies
        run: pip install -r bot/requirements.txt

      # 3) Script site/ folder ke andar chalti hai: data/, build.py aur git push sab bgtech me
      - name: Generate review & push to bgtech
        working-directory: site
        env:
          PRODUCT_URLS: ${{ inputs.urls || github.event.client_payload.urls }}
          PAGES_DEPLOY_WAIT: "90"
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          TECHGLOW_GH_TOKEN: ${{ secrets.TECHGLOW_GH_TOKEN }}
          TECHGLOW_WORKFLOW: ${{ vars.TECHGLOW_WORKFLOW }}
        run: python ../bot/amazon_to_blogger.py
